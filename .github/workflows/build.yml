name: Build

on:
  push:
    branches: ["**"]
    # pushing a tag like v1.0.0 also publishes a GitHub Release with the binaries
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the version in Cargo.toml (creates the tag v<version>)"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Ubuntu: the Linux files then also run on Ubuntu 22.04,
          # Debian 12, Linux Mint 21 and newer (glibc 2.35)
          - os: ubuntu-22.04
            artifact: ais-chat-client-linux
          - os: windows-latest
            artifact: ais-chat-client-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev

      - name: cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # one cache per runner image: C parts (e.g. the vendored D-Bus) compiled on a newer
          # Ubuntu do not link on an older one
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir dist
          # the plain program, and a .tar.gz (keeps the "executable" permission)
          cp target/release/ais-chat-client dist/ais-chat-client-linux-x86_64
          tar -czf dist/ais-chat-client-linux-x86_64.tar.gz -C target/release ais-chat-client
          # .deb with menu entry and icon (see [package.metadata.deb] in Cargo.toml)
          cargo deb --no-build --output "dist/ais-chat-client_${version}_amd64.deb"
          # AppImage: one file that runs on most distributions; libxkbcommon-x11 is loaded at
          # runtime, so it is bundled explicitly
          curl -sSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          cp assets/icon.png ais-chat-client.png
          APPIMAGE_EXTRACT_AND_RUN=1 LDAI_OUTPUT=dist/ais-chat-client-linux-x86_64.AppImage ./linuxdeploy \
            --appdir AppDir \
            --executable target/release/ais-chat-client \
            --desktop-file pkg/ais-chat-client.desktop \
            --icon-file ais-chat-client.png \
            --library /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0 \
            --output appimage
          ls -la dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/ais-chat-client.exe dist/ais-chat-client-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    # a pushed v* tag, or "Run workflow" with "release" ticked
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            # never replace a release that already exists
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag already exists – raise the version in Cargo.toml first"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " { f = ($2 == v) ; next } f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AIS.chat Client ${{ steps.version.outputs.tag }}
          body_path: notes.md
          files: dist/*
