name: Build

on:
  push:
    branches: ["**"]
    # pushing a tag like v1.0.0 also publishes a GitHub Release with the binaries
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the version in Cargo.toml (creates the tag v<version>)"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ais-chat-client-linux
          - os: windows-latest
            artifact: ais-chat-client-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        # tar keeps the "executable" permission
        run: |
          mkdir dist
          tar -czf dist/ais-chat-client-linux-x86_64.tar.gz -C target/release ais-chat-client

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/ais-chat-client.exe dist/ais-chat-client-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    # a pushed v* tag, or "Run workflow" with "release" ticked
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            # never replace a release that already exists
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag already exists – raise the version in Cargo.toml first"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " { f = ($2 == v) ; next } f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AIS.chat Client ${{ steps.version.outputs.tag }}
          body_path: notes.md
          files: dist/*
