[package]
name = "ais-chat-client"
version = "1.2.2"
edition = "2021"
description = "Small native desktop chat client for a shared AIS.chat character"
repository = "https://github.com/dijakonal/wpu-feel-chatbot"

# `cargo deb` builds the .deb package (Debian, Ubuntu, Mint, …)
[package.metadata.deb]
maintainer = "dijakonal <https://github.com/dijakonal>"
copyright = "dijakonal"
section = "education"
priority = "optional"
extended-description = """\
Native desktop chat window for one shared AIS.chat character: streamed Markdown
answers, several chats, file attachments, answer language, optional GitHub
integration. Unofficial client."""
# libxkbcommon-x11 is loaded at runtime (not linked), so $auto cannot see it
depends = "$auto, libxkbcommon-x11-0"
assets = [
    ["target/release/ais-chat-client", "usr/bin/", "755"],
    ["pkg/ais-chat-client.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/ais-chat-client.png", "644"],
]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
eframe = "0.29"
# "vendored" builds D-Bus itself, so Linux builds need no extra -dev package
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
rfd = "0.15"
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sys-locale = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
strip = true
